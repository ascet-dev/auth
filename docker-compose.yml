services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      # PG18+: маунт в /var/lib/postgresql (не .../data) — рекомендация официального образа
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres_migrations:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG__CONNECTION__DSN: postgresql://postgres:postgres@postgres:5432/auth
    command: alembic upgrade head

  data_migrations:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      postgres_migrations:
        condition: service_completed_successfully
    environment:
      PG__CONNECTION__DSN: postgresql://postgres:postgres@postgres:5432/auth
    command: python manage.py apply-sql data/init_data.sql

  bootstrap:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: backend:latest
    depends_on:
      data_migrations:
        condition: service_completed_successfully
    environment:
      ENV: COMPOSE
      PG__CONNECTION__DSN: postgresql://postgres:postgres@postgres:5432/auth
      AUTH__OWNER_LOGIN: ${OWNER_LOGIN:-admin}
      AUTH__OWNER_PASSWORD: ${OWNER_PASSWORD:-admin}
    command: python manage.py bootstrap-owner

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: backend:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      postgres_migrations:
        condition: service_completed_successfully
      data_migrations:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    ports:
      # Слушаем только localhost: turnkey-стек поднимается с дефолтными кредами
      # владельца (admin/admin), наружу его публиковать нельзя.
      # Для доступа извне задайте BIND_HOST=0.0.0.0 и OWNER_PASSWORD.
      - "${BIND_HOST:-127.0.0.1}:8003:8001"
    environment:
      PYTHONUNBUFFERED: 1
      ENV: COMPOSE
      APP__HOST: 0.0.0.0
      APP__PORT: 8001
      PG__CONNECTION__DSN: postgresql://postgres:postgres@postgres:5432/auth
      S3__CONNECTION__URL: "http://minio:9000"
      # Ключи генерирует `make keys` в ./secrets (в образ не попадают)
      AUTH__PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
      AUTH__PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
    volumes:
      - ./secrets:/app/secrets:ro
    command: python manage.py start-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/liveness"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2020-11-13T20-10-18Z
    ports:
      - "${BIND_HOST:-127.0.0.1}:9000:9000"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio_init:
    image: minio/mc:RELEASE.2021-03-10T05-59-20Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/bucket || true
      "

volumes:
  postgres_data:
